name: remote-sql-build

on:
  push:
    branches:
      - remote-sql-postgres-workspace
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to embed in the Codex binary, for example 0.142.5-patch-1.
        required: false
        type: string
      deploy:
        description: Deploy the built artifact to the k3s copy workspace.
        required: false
        type: boolean
        default: true

concurrency:
  group: remote-sql-build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CODEX_REMOTE_SQL_DEFAULT_VERSION: "0.142.5-patch-1"
  RUST_MIN_STACK: "8388608"

jobs:
  linux-cargo-build:
    name: Linux remote SQL cargo build
    runs-on: ubuntu-22.04
    outputs:
      codex_sha256: ${{ steps.stage-release.outputs.codex_sha256 }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
      - name: Embed release version
        env:
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          set -euo pipefail
          release_version="${INPUT_RELEASE_VERSION:-}"
          if [ -z "${release_version}" ] && [[ "${GITHUB_REF_NAME}" =~ v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*) ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi
          if [ -z "${release_version}" ]; then
            release_version="${CODEX_REMOTE_SQL_DEFAULT_VERSION}"
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::release_version must be a Cargo-compatible semver value: ${release_version}"
            exit 1
          fi
          sed -i "s/^version = \"0\.0\.0\"$/version = \"${release_version}\"/" Cargo.toml
          grep -qx "version = \"${release_version}\"" Cargo.toml
          cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Build remote SQL targets
        run: |
          cargo build --ignore-rust-version --release \
            -p codex-cli \
            --bin codex
      - name: Stage release artifact
        id: stage-release
        run: |
          set -euo pipefail
          mkdir -p target/codex-release
          for bin in codex; do
            if [ -x "target/release/${bin}" ]; then
              cp "target/release/${bin}" "target/codex-release/${bin}"
            fi
          done
          for bin in target/codex-release/*; do
            if [ -f "${bin}" ] && [ -x "${bin}" ]; then
              strip --strip-unneeded "${bin}"
            fi
          done
          test -x target/codex-release/codex
          sha256sum target/codex-release/* > target/codex-release/SHA256SUMS
          codex_sha256="$(sha256sum target/codex-release/codex | cut -d ' ' -f 1)"
          echo "codex_sha256=${codex_sha256}" >> "${GITHUB_OUTPUT}"
          du -sh target/codex-release
          ls -lh target/codex-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-linux-glibc235
          path: codex-rs/target/codex-release/
          if-no-files-found: error

  deploy-copy-workspace:
    name: Deploy remote SQL artifact to copy workspace
    runs-on: ubuntu-22.04
    needs: linux-cargo-build
    if: ${{ github.event_name == 'push' || inputs.deploy == true }}
    env:
      CODEX_DEPLOY_CONTAINER: workspace
      CODEX_DEPLOY_NAMESPACE: codex-internal
      CODEX_DEPLOY_POD_PREFIX: codex-workspace-copy-
      CODEX_DEPLOY_RELEASE_NAME: remote-sql-e1b36e9caa-x86_64-unknown-linux-gnu
      CODEX_DEPLOY_SSH_HOST: ${{ secrets.CODEX_DEPLOY_SSH_HOST || vars.CODEX_DEPLOY_SSH_HOST }}
      CODEX_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.CODEX_DEPLOY_SSH_KNOWN_HOSTS }}
      CODEX_DEPLOY_SSH_PORT: ${{ secrets.CODEX_DEPLOY_SSH_PORT || vars.CODEX_DEPLOY_SSH_PORT }}
      CODEX_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEX_DEPLOY_SSH_PRIVATE_KEY }}
      CODEX_DEPLOY_SSH_USER: ${{ secrets.CODEX_DEPLOY_SSH_USER || vars.CODEX_DEPLOY_SSH_USER }}
      EXPECTED_CODEX_SHA256: ${{ needs.linux-cargo-build.outputs.codex_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-linux-glibc235
          path: codex-artifact

      - name: Deploy artifact over SSH
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in \
            CODEX_DEPLOY_SSH_HOST \
            CODEX_DEPLOY_SSH_PRIVATE_KEY \
            CODEX_DEPLOY_SSH_USER \
            EXPECTED_CODEX_SHA256
          do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::notice::Skipping deployment; missing required configuration: %s\n' "${missing[*]}"
            exit 0
          fi

          CODEX_DEPLOY_SSH_PORT="${CODEX_DEPLOY_SSH_PORT:-22}"
          artifact="codex-artifact/codex"
          test -x "${artifact}"
          actual_sha256="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
          if [ "${actual_sha256}" != "${EXPECTED_CODEX_SHA256}" ]; then
            echo "::error::Downloaded artifact sha256 does not match build output"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_path=~/.ssh/codex-deploy-key
          printf '%s\n' "${CODEX_DEPLOY_SSH_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"

          known_hosts_path=~/.ssh/known_hosts
          if [ -n "${CODEX_DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${CODEX_DEPLOY_SSH_KNOWN_HOSTS}" > "${known_hosts_path}"
          else
            ssh-keyscan -p "${CODEX_DEPLOY_SSH_PORT}" "${CODEX_DEPLOY_SSH_HOST}" > "${known_hosts_path}"
          fi
          chmod 600 "${known_hosts_path}"

          remote_artifact="/tmp/codex-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"
          ssh_base=(
            ssh
            -i "${key_path}"
            -p "${CODEX_DEPLOY_SSH_PORT}"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${known_hosts_path}"
            "${CODEX_DEPLOY_SSH_USER}@${CODEX_DEPLOY_SSH_HOST}"
          )
          scp_base=(
            scp
            -i "${key_path}"
            -P "${CODEX_DEPLOY_SSH_PORT}"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${known_hosts_path}"
          )

          "${scp_base[@]}" "${artifact}" "${CODEX_DEPLOY_SSH_USER}@${CODEX_DEPLOY_SSH_HOST}:${remote_artifact}"

          "${ssh_base[@]}" \
            "EXPECTED_CODEX_SHA256='${EXPECTED_CODEX_SHA256}' \
             CODEX_DEPLOY_CONTAINER='${CODEX_DEPLOY_CONTAINER}' \
             CODEX_DEPLOY_NAMESPACE='${CODEX_DEPLOY_NAMESPACE}' \
             CODEX_DEPLOY_POD_PREFIX='${CODEX_DEPLOY_POD_PREFIX}' \
             CODEX_DEPLOY_RELEASE_NAME='${CODEX_DEPLOY_RELEASE_NAME}' \
             REMOTE_ARTIFACT='${remote_artifact}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          actual_sha256="$(sha256sum "${REMOTE_ARTIFACT}" | cut -d ' ' -f 1)"
          if [ "${actual_sha256}" != "${EXPECTED_CODEX_SHA256}" ]; then
            echo "remote artifact sha256 mismatch" >&2
            exit 1
          fi

          pod="$(
            kubectl -n "${CODEX_DEPLOY_NAMESPACE}" get pods --no-headers \
              | awk -v prefix="${CODEX_DEPLOY_POD_PREFIX}" '$1 ~ ("^" prefix) && $3 == "Running" { print $1; exit }'
          )"
          if [ -z "${pod}" ]; then
            echo "no running ${CODEX_DEPLOY_POD_PREFIX} pod found" >&2
            exit 1
          fi

          pod_artifact="/tmp/codex-${EXPECTED_CODEX_SHA256}"
          kubectl -n "${CODEX_DEPLOY_NAMESPACE}" cp "${REMOTE_ARTIFACT}" "${pod}:${pod_artifact}" -c "${CODEX_DEPLOY_CONTAINER}"
          kubectl -n "${CODEX_DEPLOY_NAMESPACE}" exec "${pod}" -c "${CODEX_DEPLOY_CONTAINER}" -- sh -s -- \
            "${EXPECTED_CODEX_SHA256}" "${CODEX_DEPLOY_RELEASE_NAME}" "${pod_artifact}" <<'POD_SCRIPT'
          set -eu

          expected_sha256="$1"
          release_name="$2"
          src="$3"

          actual_line="$(sha256sum "${src}")"
          actual_sha256="${actual_line%% *}"
          if [ "${actual_sha256}" != "${expected_sha256}" ]; then
            echo "pod artifact sha256 mismatch" >&2
            exit 1
          fi
          chmod 0755 "${src}"

          ts="$(date +%Y%m%d%H%M%S)"
          for dest in \
            "/home/codex/.codex/packages/standalone/releases/${release_name}/bin/codex" \
            "/workspace/shared-state/.git/codex-persist/codex-standalone/releases/${release_name}/bin/codex"
          do
            mkdir -p "$(dirname "${dest}")"
            if [ -f "${dest}" ]; then
              cp "${dest}" "${dest}.before-gh-deploy.${ts}"
            fi
            tmp="${dest}.new-gh-deploy.${ts}"
            cp "${src}" "${tmp}"
            chmod 0755 "${tmp}"
            mv -f "${tmp}" "${dest}"
            sha256sum "${dest}"
          done

          for proc in /proc/[0-9]*; do
            p="${proc#/proc/}"
            [ -r "${proc}/comm" ] || continue
            [ "$(cat "${proc}/comm" 2>/dev/null || true)" = codex ] || continue
            cmd="$(tr '\0' ' ' < "${proc}/cmdline" 2>/dev/null || true)"
            case "${cmd}" in
              *app-server*) kill "${p}" 2>/dev/null || true ;;
            esac
          done
          sleep 1

          codex_bin=/home/codex/.codex/packages/standalone/current/bin/codex
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon enable-remote-control" || true
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon start"
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon version"
          sha256sum "${codex_bin}"
          POD_SCRIPT

          rm -f "${REMOTE_ARTIFACT}"
          REMOTE_SCRIPT
