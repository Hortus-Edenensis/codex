name: remote-sql-build

on:
  push:
    branches:
      - remote-sql-postgres-workspace
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_MIN_STACK: "8388608"

jobs:
  linux-cargo-build:
    name: Linux remote SQL cargo build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
      - name: Build remote SQL targets
        run: |
          cargo build --ignore-rust-version \
            -p codex-postgres-thread-store \
            -p codex-core \
            -p codex-app-server \
            -p codex-mcp-server \
            -p codex-thread-manager-sample \
            -p codex-cli
      - name: Stage release artifact
        run: |
          set -euo pipefail
          mkdir -p target/codex-release
          for bin in codex codex-app-server codex-mcp-server codex-thread-manager-sample; do
            if [ -x "target/debug/${bin}" ]; then
              cp "target/debug/${bin}" "target/codex-release/${bin}"
            fi
          done
          test -x target/codex-release/codex
          sha256sum target/codex-release/* > target/codex-release/SHA256SUMS
          ls -lh target/codex-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-linux-debug
          path: codex-rs/target/codex-release/
          if-no-files-found: error
