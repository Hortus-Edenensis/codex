name: remote-sql-build

on:
  push:
    branches:
      - remote-sql-postgres-workspace
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to embed in the Codex binary, for example 0.142.5-patch-1.
        required: false
        type: string

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CODEX_REMOTE_SQL_DEFAULT_VERSION: "0.142.5-patch-1"
  RUST_MIN_STACK: "8388608"

jobs:
  linux-cargo-build:
    name: Linux remote SQL cargo build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
      - name: Embed release version
        env:
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          set -euo pipefail
          release_version="${INPUT_RELEASE_VERSION:-}"
          if [ -z "${release_version}" ] && [[ "${GITHUB_REF_NAME}" =~ v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*) ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi
          if [ -z "${release_version}" ]; then
            release_version="${CODEX_REMOTE_SQL_DEFAULT_VERSION}"
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::release_version must be a Cargo-compatible semver value: ${release_version}"
            exit 1
          fi
          sed -i "s/^version = \"0\.0\.0\"$/version = \"${release_version}\"/" Cargo.toml
          grep -qx "version = \"${release_version}\"" Cargo.toml
          cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Build remote SQL targets
        run: |
          cargo build --ignore-rust-version --release \
            -p codex-cli \
            --bin codex
      - name: Stage release artifact
        run: |
          set -euo pipefail
          mkdir -p target/codex-release
          for bin in codex; do
            if [ -x "target/release/${bin}" ]; then
              cp "target/release/${bin}" "target/codex-release/${bin}"
            fi
          done
          for bin in target/codex-release/*; do
            if [ -f "${bin}" ] && [ -x "${bin}" ]; then
              strip --strip-unneeded "${bin}"
            fi
          done
          test -x target/codex-release/codex
          sha256sum target/codex-release/* > target/codex-release/SHA256SUMS
          du -sh target/codex-release
          ls -lh target/codex-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-linux-glibc235
          path: codex-rs/target/codex-release/
          if-no-files-found: error
