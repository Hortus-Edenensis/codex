name: remote-sql-build

on:
  push:
    branches:
      - remote-sql-postgres-workspace
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to embed in the Codex binary, for example 0.142.5-patch-1.
        required: false
        type: string
      deploy:
        description: Deploy the built artifact to the k3s copy workspace.
        required: false
        type: boolean
        default: true

concurrency:
  group: remote-sql-build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CODEX_REMOTE_SQL_CHANNEL: "copy"
  CODEX_REMOTE_SQL_DEFAULT_VERSION_BASE: "0.142.5"
  RUST_MIN_STACK: "8388608"

jobs:
  linux-cargo-build:
    name: Linux remote SQL cargo build
    runs-on: ubuntu-22.04
    outputs:
      codex_sha256: ${{ steps.stage-release.outputs.codex_sha256 }}
      release_version: ${{ steps.embed-release.outputs.release_version }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
      - name: Embed release version
        id: embed-release
        env:
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          set -euo pipefail
          release_version="${INPUT_RELEASE_VERSION:-}"
          if [ -z "${release_version}" ] && [[ "${GITHUB_REF_NAME}" =~ v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*) ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi
          if [ -z "${release_version}" ]; then
            release_version="${CODEX_REMOTE_SQL_DEFAULT_VERSION_BASE}-remote-sql-${CODEX_REMOTE_SQL_CHANNEL}.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:12}"
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::release_version must be a Cargo-compatible semver value: ${release_version}"
            exit 1
          fi
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          sed -i "s/^version = \"0\.0\.0\"$/version = \"${release_version}\"/" Cargo.toml
          grep -qx "version = \"${release_version}\"" Cargo.toml
          cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Build remote SQL targets
        run: |
          cargo build --ignore-rust-version --release \
            -p codex-cli \
            --bin codex
      - name: Stage release artifact
        id: stage-release
        run: |
          set -euo pipefail
          mkdir -p target/codex-release
          for bin in codex; do
            if [ -x "target/release/${bin}" ]; then
              cp "target/release/${bin}" "target/codex-release/${bin}"
            fi
          done
          for bin in target/codex-release/*; do
            if [ -f "${bin}" ] && [ -x "${bin}" ]; then
              strip --strip-unneeded "${bin}"
            fi
          done
          test -x target/codex-release/codex
          sha256sum target/codex-release/* > target/codex-release/SHA256SUMS
          codex_sha256="$(sha256sum target/codex-release/codex | cut -d ' ' -f 1)"
          echo "codex_sha256=${codex_sha256}" >> "${GITHUB_OUTPUT}"
          du -sh target/codex-release
          ls -lh target/codex-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-linux-glibc235
          path: codex-rs/target/codex-release/
          if-no-files-found: error

  deploy-copy-workspace:
    name: Deploy remote SQL artifact to copy workspace
    runs-on: [self-hosted, Linux, X64, codex-workspace-copy]
    needs: linux-cargo-build
    if: ${{ github.event_name == 'push' || inputs.deploy == true }}
    env:
      ALL_PROXY: http://10.42.0.1:10809
      CODEX_DEPLOY_CONTAINER: workspace
      CODEX_DEPLOY_CHANNEL: copy-workspace
      CODEX_DEPLOY_NAMESPACE: codex-internal
      CODEX_DEPLOY_POD_PREFIX: codex-workspace-copy-
      CODEX_DEPLOY_RELEASE_TAG: ${{ needs.linux-cargo-build.outputs.release_version }}
      CODEX_DEPLOY_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      EXPECTED_CODEX_SHA256: ${{ needs.linux-cargo-build.outputs.codex_sha256 }}
      HTTPS_PROXY: http://10.42.0.1:10809
      HTTP_PROXY: http://10.42.0.1:10809
      NO_PROXY: 127.0.0.1,localhost,10.0.0.0/8,10.42.0.0/16,202.189.11.100
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-linux-glibc235
          path: codex-artifact

      - name: Deploy artifact from self-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED_CODEX_SHA256:-}" ]; then
            echo "::error::Missing build sha256 output"
            exit 1
          fi

          artifact="codex-artifact/codex"
          test -f "${artifact}"
          actual_sha256="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
          if [ "${actual_sha256}" != "${EXPECTED_CODEX_SHA256}" ]; then
            echo "::error::Downloaded artifact sha256 does not match build output"
            exit 1
          fi

          release_name="${CODEX_DEPLOY_CHANNEL}-${CODEX_DEPLOY_RELEASE_TAG//+/-}-${CODEX_DEPLOY_TARGET_TRIPLE}"

          pod="$(
            kubectl -n "${CODEX_DEPLOY_NAMESPACE}" get pods --no-headers \
              | awk -v prefix="${CODEX_DEPLOY_POD_PREFIX}" '$1 ~ ("^" prefix) && $3 == "Running" { print $1; exit }'
          )"
          if [ -z "${pod}" ]; then
            echo "::error::No running ${CODEX_DEPLOY_POD_PREFIX} pod found"
            exit 1
          fi

          pod_artifact="/tmp/codex-${EXPECTED_CODEX_SHA256}"
          kubectl -n "${CODEX_DEPLOY_NAMESPACE}" cp "${artifact}" "${pod}:${pod_artifact}" -c "${CODEX_DEPLOY_CONTAINER}"
          kubectl -n "${CODEX_DEPLOY_NAMESPACE}" exec -i "${pod}" -c "${CODEX_DEPLOY_CONTAINER}" -- sh -s -- \
            "${EXPECTED_CODEX_SHA256}" "${release_name}" "${pod_artifact}" "${CODEX_DEPLOY_RELEASE_TAG}" \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_REF_NAME}" \
            "${CODEX_DEPLOY_CHANNEL}" <<'POD_SCRIPT'
          set -eu

          expected_sha256="$1"
          release_name="$2"
          src="$3"
          release_tag="$4"
          github_sha="$5"
          github_run_id="$6"
          github_run_attempt="$7"
          github_ref_name="$8"
          deploy_channel="$9"

          actual_line="$(sha256sum "${src}")"
          actual_sha256="${actual_line%% *}"
          if [ "${actual_sha256}" != "${expected_sha256}" ]; then
            echo "pod artifact sha256 mismatch" >&2
            exit 1
          fi
          chmod 0755 "${src}"

          ts="$(date +%Y%m%d%H%M%S)"
          for dest in \
            "/home/codex/.codex/packages/standalone/releases/${release_name}/bin/codex" \
            "/workspace/shared-state/.git/codex-persist/codex-standalone/releases/${release_name}/bin/codex"
          do
            mkdir -p "$(dirname "${dest}")"
            if [ -f "${dest}" ]; then
              cp "${dest}" "${dest}.before-gh-deploy.${ts}"
            fi
            tmp="${dest}.new-gh-deploy.${ts}"
            cp "${src}" "${tmp}"
            chmod 0755 "${tmp}"
            mv -f "${tmp}" "${dest}"
            sha256sum "${dest}"
          done

          for tag_dir in \
            "/home/codex/.codex/packages/standalone/current" \
            "/home/codex/.codex/packages/standalone/releases/${release_name}" \
            "/workspace/shared-state/.git/codex-persist/codex-standalone/releases/${release_name}"
          do
            mkdir -p "${tag_dir}"
            printf 'release_version=%s\nrelease_name=%s\ndeploy_channel=%s\ngit_sha=%s\nrun_id=%s\nrun_attempt=%s\nref_name=%s\n' \
              "${release_tag}" \
              "${release_name}" \
              "${deploy_channel}" \
              "${github_sha}" \
              "${github_run_id}" \
              "${github_run_attempt}" \
              "${github_ref_name}" > "${tag_dir}/REMOTE_SQL_BUILD_TAG"
          done

          codex_bin=/home/codex/.codex/packages/standalone/current/bin/codex
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon stop" || true
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon disable-remote-control" || true
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon start"
          env HOME=/home/codex USER=codex LOGNAME=codex \
            CODEX_REMOTE_SQL_URL="${CODEX_REMOTE_SQL_URL:-}" \
            CODEX_REDIS_URL="${CODEX_REDIS_URL:-}" \
            su -m codex -c "${codex_bin} app-server daemon version"
          sha256sum "${codex_bin}"
          rm -f "${src}"
          POD_SCRIPT

  smoke-copy-workspace:
    name: Smoke test copy workspace resume and goals
    runs-on: [self-hosted, Linux, X64, codex-workspace-copy]
    needs: deploy-copy-workspace
    env:
      ALL_PROXY: http://10.42.0.1:10809
      CODEX_DEPLOY_CONTAINER: workspace
      CODEX_DEPLOY_NAMESPACE: codex-internal
      CODEX_DEPLOY_POD_PREFIX: codex-workspace-copy-
      COPY_WORKSPACE_MIN_INTERACTIVE_THREADS: "8"
      COPY_WORKSPACE_RESUME_THREAD_ID: 019f1846-9419-7853-b035-f2ba0fad3d72
      HTTPS_PROXY: http://10.42.0.1:10809
      HTTP_PROXY: http://10.42.0.1:10809
      NO_PROXY: 127.0.0.1,localhost,10.0.0.0/8,10.42.0.0/16,202.189.11.100
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Smoke test copy workspace control plane
        shell: bash
        run: |
          set -euo pipefail

          pod="$(
            kubectl -n "${CODEX_DEPLOY_NAMESPACE}" get pods --no-headers \
              | awk -v prefix="${CODEX_DEPLOY_POD_PREFIX}" '$1 ~ ("^" prefix) && $3 == "Running" { print $1; exit }'
          )"
          if [ -z "${pod}" ]; then
            echo "::error::No running ${CODEX_DEPLOY_POD_PREFIX} pod found"
            exit 1
          fi

          python3 .github/scripts/copy_workspace_smoke.py \
            --namespace "${CODEX_DEPLOY_NAMESPACE}" \
            --pod "${pod}" \
            --container "${CODEX_DEPLOY_CONTAINER}" \
            --resume-thread-id "${COPY_WORKSPACE_RESUME_THREAD_ID}" \
            --min-interactive-threads "${COPY_WORKSPACE_MIN_INTERACTIVE_THREADS}"
